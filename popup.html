<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebAble - Web Accessibility Tools</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
  <style>
  </style>
</head>
<body class="popup-body chrome-extension-popup">
  <div class="container">
    <header class="header">
      <div class="header-content">
        <i class="fas fa-universal-access header-icon"></i>
        <h1>WebAble</h1>
      </div>
      <p class="header-subtitle">Accessibility tools to let EVERYONE access the internet</p>
    </header>
    
    <div class="main-content">
      <div class="settings-container">
        <div class="settings-section">
            <div class="settings-group">
              <h2 class="group-title">Text</h2>
              <div class="setting">
                <label for="textSize">
                  <div class="setting-name-row">
                    <span class="setting-name"><i class="fas fa-text-height setting-icon"></i>Text Size</span>
                    <span class="value-display" id="textSizeValue">100%</span>
                  </div>
                </label>
                <input type="range" id="textSize" min="80" max="200" step="5" value="100" aria-label="Adjust text size">
                <div class="range-labels">
                  <span>A</span>
                  <span>Aa</span>
                  <span>AA</span>
                </div>
              </div>

              <div class="setting">
                <label for="textSpacing">
                  <div class="setting-name-row">
                    <span class="setting-name"><i class="fas fa-text-width setting-icon"></i>Letter Spacing</span>
                    <span class="value-display accent" id="textSpacingValue">100%</span>
                  </div>
                </label>
                <input type="range" id="textSpacing" min="1.0" max="3.0" step="0.1" value="1.0" aria-label="Adjust word spacing">
                <div class="range-labels">
                  <span>Normal</span>
                  <span>Wide</span>
                </div>
              </div>

              <div class="setting">
                <label for="lineSpacing">
                  <div class="setting-name-row">
                    <span class="setting-name"><i class="fas fa-align-justify setting-icon"></i>Line Spacing</span>
                    <span class="value-display accent" id="lineSpacingValue">100%</span>
                  </div>
                </label>
                <input type="range" id="lineSpacing" min="1.0" max="3.0" step="0.1" value="1.0" aria-label="Adjust line spacing">
                <div class="range-labels">
                  <span>Normal</span>
                  <span>Wide</span>
                </div>
              </div>
            </div>

            <div class="settings-group">
              <h2 class="group-title">Display</h2>
              <div class="setting">
                <label for="dyslexicFont">
                  <div class="setting-name-row">
                    <input type="checkbox" id="dyslexicFont" aria-label="Enable dyslexic-friendly font">
                    <span class="setting-name dyslexic-preview">Dyslexia-Friendly Font</span>
                  </div>
                </label>
              </div>

              <div class="setting">
                <label for="highContrast">
                  <div class="setting-name-row">
                    <input type="checkbox" id="highContrast" aria-label="Enable high contrast mode">
                    <span class="setting-name"><i class="fas fa-circle-half-stroke setting-icon"></i>High Contrast Mode</span>
                  </div>
                </label>
              </div>
            </div>
          </div>

        <div class="action-buttons">
          <button id="resetBtn" class="ai-feature-btn secondary">
            <i class="fas fa-undo"></i>
            <div class="ai-feature-content">
              <span class="ai-feature-title">Reset to Defaults</span>
              <span class="ai-feature-desc">Restore original settings</span>
            </div>
          </button>
        </div>

        <div id="status" class="status-message" style="display: none;"></div>
      </div>
    </div>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
