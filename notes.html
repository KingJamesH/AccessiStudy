<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WebAble - AI Summaries</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    :root {
      --bg-color: #1a1d23;
      --card-bg: #2a2d35;
      --border-color: #3a3f4b;
      --text-color: #e1e5ea;
      --secondary-text: #8b949e;
      --primary-color: #3b82f6;
      --primary-hover: #2563eb;
      --secondary-bg: #374151;
      --secondary-hover: #4b5563;
      --danger-color: #ef4444;
      --danger-hover: #dc2626;
      --success-color: #10b981;
      --transition-speed: 0.3s;
      --transition-easing: cubic-bezier(0.4, 0, 0.2, 1);
    }

    body {
      background: var(--bg-color);
      color: var(--text-color);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      margin: 0;
      padding: 16px;
    }

    .notes-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-color);
    }

    .notes-header h1 {
      font-size: 20px;
      font-weight: 700;
      margin: 0;
      letter-spacing: -0.3px;
      color: var(--text-color);
    }

    .notes-actions {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .notes-actions button {
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 500;
      border-radius: 6px;
      border: 1px solid transparent;
      cursor: pointer;
      transition: all var(--transition-speed) var(--transition-easing);
      font-family: inherit;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .notes-actions button:hover {
      transform: translateY(-1px);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
    }

    .notes-actions button:active {
      transform: translateY(0);
    }

    .notes-actions button:not(.secondary):not(.danger) {
      background: var(--primary-color);
      color: white;
      border-color: var(--primary-color);
    }

    .notes-actions button:not(.secondary):not(.danger):hover {
      background: var(--primary-hover);
      border-color: var(--primary-hover);
    }

    .notes-actions button.secondary {
      background: var(--secondary-bg);
      color: var(--text-color);
      border-color: var(--border-color);
    }

    .notes-actions button.secondary:hover {
      background: var(--secondary-hover);
      border-color: var(--primary-color);
    }

    .notes-actions button.danger {
      background: var(--danger-color);
      color: white;
      border-color: var(--danger-color);
    }

    .notes-actions button.danger:hover {
      background: var(--danger-hover);
      border-color: var(--danger-hover);
      box-shadow: 0 2px 8px rgba(239, 68, 68, 0.3);
    }

    .notes-container {
      max-width: 698px;
      margin: 0 auto;
    }

    .note-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 12px;
      transition: all var(--transition-speed) var(--transition-easing);
    }

    .note-card:hover {
      border-color: var(--primary-color);
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.15);
    }

    .note-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 8px;
    }

    .note-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-color);
      margin: 0;
      flex: 1;
      line-height: 1.3;
    }

    .note-actions {
      display: flex;
      gap: 8px;
      align-items: flex-start;
    }

    .delete-note-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 16px;
      padding: 6px;
      border-radius: 4px;
      transition: all var(--transition-speed) var(--transition-easing);
      color: var(--secondary-text);
      min-width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .delete-note-btn:hover {
      background: rgba(239, 68, 68, 0.15);
      color: var(--danger-color);
      transform: scale(1.05);
    }

    .delete-note-btn:active {
      background: rgba(239, 68, 68, 0.25);
      transform: scale(0.95);
    }

    .note-text {
      font-size: 14px;
      line-height: 1.5;
      white-space: pre-wrap;
      margin: 8px 0;
      color: var(--text-color);
    }

    .note-source {
      font-size: 12px;
      color: var(--secondary-text);
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid var(--border-color);
    }

    .note-source a {
      color: var(--primary-color);
      text-decoration: none;
    }

    .note-source a:hover {
      text-decoration: underline;
    }

    .note-source span[title] {
      cursor: help;
      opacity: 0.8;
    }

    .empty-state {
      text-align: center;
      color: var(--secondary-text);
      padding: 48px 16px;
      border: 2px dashed var(--border-color);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.02);
    }

    .empty-state strong {
      color: var(--primary-color);
      font-weight: 600;
    }

    /* Responsive design */
    @media (max-width: 768px) {
      body {
        padding: 12px;
      }

      .notes-header {
        flex-direction: column;
        gap: 12px;
        align-items: flex-start;
      }

      .notes-actions {
        flex-wrap: wrap;
        gap: 8px;
      }

      .notes-actions button {
        padding: 8px 12px;
        font-size: 12px;
      }

      .note-card {
        padding: 12px;
      }

      .note-title {
        font-size: 14px;
      }

      .note-text {
        font-size: 13px;
      }
    }
  </style>
</head>
<body>
  <div class="notes-container">
    <div class="notes-header">
      <h1>WebAble - AI Summaries</h1>
      <div class="notes-actions">
        <button id="refreshBtn" class="secondary">🔄 Refresh Notes</button>
        <button id="clearAllBtn" class="danger">🗑️ Clear All Notes</button>
        <button id="exportBtn">💾 Save Notes File</button>
      </div>
    </div>

    <div id="notesRoot"></div>
  </div>

  <script src="notes.js"></script>
</body>
</html>
